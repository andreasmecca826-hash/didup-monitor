on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions:
  contents: write   # serve per committare

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # ... checkout, setup, install, run monitor ...

      - name: Commit state.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state.json
          git diff --quiet && git diff --staged --quiet || git commit -m "update state [skip ci]"

          git push
