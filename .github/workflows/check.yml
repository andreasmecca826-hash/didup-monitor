name: Check DidUP Debug

on:
  workflow_dispatch:  # Solo manuale per ora

jobs:
  debug-check:
    runs-on: ubuntu-latest
    steps:
      - name: Test 1 - Checkout
        uses: actions/checkout@v4
        id: checkout_step
      
      - name: Test 2 - Echo
        run: echo "Checkout riuscito!"
      
      - name: Test 3 - Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
        id: python_step
      
      - name: Test 4 - Python Version
        run: python --version
      
      - name: Test 5 - Install Dipendenze
        run: pip install "didupwrapper>=0.1.1,<0.2" requests
      
      - name: Test 6 - Crea state.json finto
        run: |
          echo '{"test": true}' > state.json
          cat state.json
      
      - name: Test 7 - Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: didup-state-test
          path: state.json

          retention-days: 1
