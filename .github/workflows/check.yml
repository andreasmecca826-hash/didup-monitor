name: Check DidUP

on:
  workflow_dispatch:
    inputs:
      open_latest_circular:
        description: "Forza manualmente una nuova apertura dell'ultima circolare, anche se già acquisita"
        required: false
        type: boolean
        default: false
      app_trigger:
        description: "Avvio richiesto dal pulsante VOTO (con protezione anti-duplicati)"
        required: false
        type: boolean
        default: false
      supabase_readonly_check:
        description: "Verifica Supabase e bucket senza aprire circolari o modificare dati"
        required: false
        type: boolean
        default: false
      repair_latest_circular_metadata:
        description: "Associa al JSON l'ultimo PDF già caricato, senza aprire DidUP"
        required: false
        type: boolean
        default: false
      oauth_diagnostics:
        description: "Testa solo il login OAuth DidUP e registra metadati non sensibili"
        required: false
        type: boolean
        default: false

permissions:
  actions: read
  contents: write

concurrency:
  group: didup-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}

      - name: Salta richieste VOTO duplicate o troppo ravvicinate
        id: app_trigger_guard
        if: ${{ inputs.app_trigger }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          CURRENT_RUN_ID: ${{ github.run_id }}
        run: |
          runs="$(curl -fsSL \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/$REPOSITORY/actions/workflows/check.yml/runs?branch=$BRANCH&per_page=10")"
          should_skip="$(jq -r --arg run_id "$CURRENT_RUN_ID" --arg branch "$BRANCH" '
            [.workflow_runs[]
              | select((.id | tostring) != $run_id)
              | select(.event == "workflow_dispatch" and .head_branch == $branch)
              | select(.status != "completed" or ((now - (.created_at | fromdate)) < 180))
            ] | length > 0
          ' <<< "$runs")"
          if [ "$should_skip" = "true" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Richiesta VOTO saltata: esiste un controllo recente o in corso."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Python
        if: ${{ steps.app_trigger_guard.outputs.skip != 'true' }}
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Cache Chromium Playwright
        if: ${{ !inputs.supabase_readonly_check && !inputs.repair_latest_circular_metadata && !inputs.oauth_diagnostics && !inputs.app_trigger && steps.app_trigger_guard.outputs.skip != 'true' }}
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-1.64.1-chromium

      - name: Installa dipendenze
        if: ${{ steps.app_trigger_guard.outputs.skip != 'true' }}
        run: python -m pip install "didupwrapper>=0.1.1,<0.2" requests

      - name: Installa browser per il test login OAuth
        if: ${{ inputs.oauth_diagnostics && steps.app_trigger_guard.outputs.skip != 'true' }}
        run: |
          python -m pip install "playwright==1.64.1"
          python -m playwright install --only-shell chromium

      - name: Diagnostica login OAuth senza modificare dati
        if: ${{ inputs.oauth_diagnostics && steps.app_trigger_guard.outputs.skip != 'true' }}
        env:
          DIDUP_SCHOOL: ${{ secrets.CODICE_SCUOLA }}
          DIDUP_USER: ${{ secrets.USERNAME }}
          DIDUP_PASSWORD: ${{ secrets.PASSWORD }}
        run: python scripts/diagnose_oauth.py

      - name: Installa browser per l'acquisizione automatica delle nuove circolari
        if: ${{ !inputs.supabase_readonly_check && !inputs.repair_latest_circular_metadata && !inputs.oauth_diagnostics && steps.app_trigger_guard.outputs.skip != 'true' }}
        run: |
          python -m pip install "playwright==1.64.1"
          python -m playwright install --only-shell chromium

      - name: Verifica Supabase in sola lettura
        if: ${{ inputs.supabase_readonly_check && !inputs.oauth_diagnostics }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_STORAGE_BUCKET: circulars
        run: python scripts/check_supabase.py

      - name: Associa al JSON il PDF già caricato
        if: ${{ inputs.repair_latest_circular_metadata && !inputs.supabase_readonly_check && !inputs.oauth_diagnostics }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_STORAGE_BUCKET: circulars
        run: python scripts/repair_latest_circular_path.py

      - name: Inizializza file di stato se mancanti
        if: ${{ !inputs.supabase_readonly_check && !inputs.repair_latest_circular_metadata && !inputs.oauth_diagnostics && !inputs.app_trigger && steps.app_trigger_guard.outputs.skip != 'true' }}
        run: |
          if [ ! -f state.json ]; then
            echo '{}' > state.json
          fi

          if [ ! -f grades.json ]; then
            echo '{}' > grades.json
          fi

          if [ ! -f history.md ]; then
            printf '# Storico DidUP\n\nEventi registrati automaticamente dal monitor.\n' > history.md
          fi

      - name: Esegui monitor
        if: ${{ !inputs.supabase_readonly_check && !inputs.repair_latest_circular_metadata && !inputs.oauth_diagnostics && steps.app_trigger_guard.outputs.skip != 'true' }}
        env:
          DIDUP_SCHOOL: ${{ secrets.CODICE_SCUOLA }}
          DIDUP_USER: ${{ secrets.USERNAME }}
          DIDUP_PASSWORD: ${{ secrets.PASSWORD }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC || 'Morselli_alerts_didup' }}
          CIRCULAR_RETENTION_DAYS: 30
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_STORAGE_BUCKET: circulars
          BROWSER_AUTO_DOWNLOAD_NEW: ${{ !inputs.supabase_readonly_check && !inputs.repair_latest_circular_metadata && !inputs.app_trigger }}
          BROWSER_FORCE_LATEST: ${{ inputs.open_latest_circular && !inputs.supabase_readonly_check && !inputs.repair_latest_circular_metadata && !inputs.app_trigger }}
          VOTO_JSON_ONLY: ${{ inputs.app_trigger }}
        run: python monitor.py

      - name: Salva JSON e storico nel repository
        if: ${{ always() && !inputs.supabase_readonly_check && !inputs.oauth_diagnostics && steps.app_trigger_guard.outputs.skip != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ "${{ inputs.app_trigger }}" = "true" ]; then
            git add grades.json
          else
            git add state.json grades.json history.md
          fi

          if ! git diff --cached --quiet; then
            git commit -m "Aggiorna dati voti e stato DidUP"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          else
            echo "Nessuna modifica da salvare."
          fi
