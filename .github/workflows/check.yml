name: Check DidUP

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: didup-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installa dipendenze
        run: pip install "didupwrapper>=0.1.1,<0.2" requests

      - name: Scarica stato precedente
        uses: dawidd6/action-download-artifact@v3
        with:
          name: didup-state
          path: .
          if_no_artifact_found: ignore

      - name: Inizializza state.json se mancante
        run: |
          if [ ! -f state.json ]; then
            echo '{}' > state.json
          fi

      - name: Esegui monitor
        env:
          DIDUP_SCHOOL: ${{ secrets.CODICE_SCUOLA }}
          DIDUP_USER: ${{ secrets.USERNAME }}
          DIDUP_PASSWORD: ${{ secrets.PASSWORD }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC || 'Morselli_alerts_didup' }}
        run: python monitor.py

      - name: Salva stato
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: didup-state
          path: state.json
          retention-days: 30
          overwrite: true
