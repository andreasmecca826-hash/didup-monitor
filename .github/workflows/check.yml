name: Check DidUP

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: didup-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installa dipendenze
        run: pip install didupwrapper requests

      - name: Esegui monitor
        env:
          DIDUP_SCHOOL: ${{ secrets.DIDUP_SCHOOL }}
          DIDUP_USER: ${{ secrets.DIDUP_USER }}
          DIDUP_PASSWORD: ${{ secrets.DIDUP_PASSWORD }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC || 'Morselli_alerts_didup' }}
        run: python monitor.py

      - name: Salva state.json
        if: always()
        run: |
          if [ ! -f state.json ]; then
            echo "state.json non esiste, niente da salvare"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          if git diff --cached --quiet; then
            echo "Nessuna modifica allo stato"
          else
            git commit -m "chore: aggiorna state.json"
            git pull --rebase
            git push
          fi
