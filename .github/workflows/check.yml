name: Check DidUP

on:
  workflow_dispatch:
    inputs:
      open_latest_circular:
        description: "Test singolo: apri l'allegato della circolare più recente nella Bacheca"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: didup-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Cache Chromium Playwright
        if: ${{ inputs.open_latest_circular }}
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-1.64.1-chromium

      - name: Installa dipendenze
        run: python -m pip install "didupwrapper>=0.1.1,<0.2" requests

      - name: Installa browser per il test singolo
        if: ${{ inputs.open_latest_circular }}
        run: |
          python -m pip install "playwright==1.64.1"
          python -m playwright install --only-shell chromium

      - name: Inizializza file di stato se mancanti
        run: |
          if [ ! -f state.json ]; then
            echo '{}' > state.json
          fi

          if [ ! -f grades.json ]; then
            echo '{}' > grades.json
          fi

          if [ ! -f history.md ]; then
            printf '# Storico DidUP\n\nEventi registrati automaticamente dal monitor.\n' > history.md
          fi

      - name: Esegui monitor
        env:
          DIDUP_SCHOOL: ${{ secrets.CODICE_SCUOLA }}
          DIDUP_USER: ${{ secrets.USERNAME }}
          DIDUP_PASSWORD: ${{ secrets.PASSWORD }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC || 'Morselli_alerts_didup' }}
          CIRCULAR_RETENTION_DAYS: 30
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_STORAGE_BUCKET: circulars
          BROWSER_PROBE_LATEST: ${{ inputs.open_latest_circular }}
        run: python monitor.py

      - name: Salva JSON e storico nel repository
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add state.json grades.json history.md

          if ! git diff --cached --quiet; then
            git commit -m "Aggiorna dati voti e stato DidUP"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          else
            echo "Nessuna modifica da salvare."
          fi
