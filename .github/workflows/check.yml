
Name: Check DidUP

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: didup-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Installa dipendenze
        run: pip install "didupwrapper>=0.1.1,<0.2" requests

      - name: Ripristina state.json precedente
        uses: actions/download-artifact@v4
        with:
          name: didup-state
          path: .
        continue-on-error: true

      - name: Esegui monitor
        env:
          DIDUP_SCHOOL: ${{ secrets.CODICE_SCUOLA }}
          DIDUP_USER: ${{ secrets.USERNAME }}
          DIDUP_PASSWORD: ${{ secrets.PASSWORD }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC || 'Morselli_alerts_didup' }}
        run: python monitor.py

      - name: Salva state.json negli Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: didup-state
          path: state.json
          retention-days: 7
