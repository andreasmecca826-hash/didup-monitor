name: Check DidUP


'on':
workflow_dispatch: {}


permissions:
contents: write


jobs:
check:
runs-on: ubuntu-latest
timeout-minutes: 5
steps:
- name: Checkout
uses: actions/checkout@v6


  - name: Setup Python
    uses: actions/setup-python@v6
    with:
      python-version: "3.12"

  - name: Installa dipendenze
    run: python -m pip install "didupwrapper>=0.1.1,<0.2" requests

  - name: Inizializza file
    run: |
      [ -f state.json ] || echo '{}' > state.json
      [ -f history.md ] || printf '# Storico DidUP\n\nEventi registrati automaticamente dal monitor.\n' > history.md

  - name: Esegui monitor
    env:
      DIDUP_SCHOOL: ${{ secrets.CODICE_SCUOLA }}
      DIDUP_USER: ${{ secrets.USERNAME }}
      DIDUP_PASSWORD: ${{ secrets.PASSWORD }}
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC || 'Morselli_alerts_didup' }}
    run: python monitor.py

  - name: Salva stato nel repository
    if: always()
    run: |
      git config user.name "github-actions[bot]"
      git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      git add state.json history.md
      if ! git diff --cached --quiet; then
        git commit -m "Aggiorna stato monitor DidUP"
        git push
      fi



